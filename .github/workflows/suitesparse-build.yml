name: SuiteSparse Cloud Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile: klu (minimum) or full (all SuiteSparse projects)"
        required: true
        default: "klu"
        type: choice
        options:
          - klu
          - full
      suitesparse_ref:
        description: "SuiteSparse git tag/ref"
        required: true
        default: "v7.14.1"
        type: string

  pull_request:
    paths:
      - ".github/workflows/suitesparse-build.yml"
      - "ci/**"

  push:
    branches:
      - main
    paths:
      - ".github/workflows/suitesparse-build.yml"
      - "ci/**"

permissions:
  contents: read

env:
  DEFAULT_SUITESPARSE_REF: v7.14.1

jobs:
  build:
    name: "${{ matrix.name }} / ${{ inputs.profile || 'klu' }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            platform: linux
            arch: x86_64

          - name: windows-x86_64
            os: windows-latest
            platform: windows
            arch: x86_64

          - name: macos-arm64
            os: macos-15
            platform: macos
            arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve build settings
        id: settings
        shell: bash
        run: |
          PROFILE="${{ inputs.profile || 'klu' }}"
          SS_REF="${{ inputs.suitesparse_ref || env.DEFAULT_SUITESPARSE_REF }}"

          if [[ "$PROFILE" == "full" ]]; then
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              # SPEX requires GNU GMP/MPFR; SuiteSparse project names must be lowercase
              PROJECTS="amd;btf;camd;ccolamd;cholmod;colamd;cxsparse;graphblas;klu;ldl;rbio;spqr;umfpack;paru;mongoose"
            else
              PROJECTS="all"
            fi
          else
            PROJECTS="klu"
          fi

          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "projects=$PROJECTS" >> "$GITHUB_OUTPUT"
          echo "suitesparse_ref=$SS_REF" >> "$GITHUB_OUTPUT"

      - name: Checkout SuiteSparse
        uses: actions/checkout@v4
        with:
          repository: DrTimothyAldenDavis/SuiteSparse
          ref: ${{ steps.settings.outputs.suitesparse_ref }}
          path: _deps/SuiteSparse
          fetch-depth: 1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            libblas-dev liblapack-dev
          if [[ "${{ steps.settings.outputs.profile }}" == "full" ]]; then
            sudo apt-get install -y \
              libgmp-dev libmpfr-dev \
              libmetis-dev \
              libtbb-dev \
              libomp-dev
          fi

      - name: Install Windows OpenBLAS
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sL https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.28/OpenBLAS-0.3.28-x64.zip -o openblas.zip
          mkdir -p "C:/openblas"
          unzip -q -o openblas.zip -d "C:/openblas"
          mkdir -p "C:/openblas/lib"
          cp "C:/openblas/libopenblas.lib" "C:/openblas/lib/libopenblas.lib" || true
          cp "C:/openblas/libopenblas.lib" "C:/openblas/lib/openblas.lib" || true
          cp "C:/openblas/bin/"*.dll "C:/openblas/lib/" || true
          cp "C:/openblas/bin/"*.dll "C:/Windows/System32/" || true
          echo "C:/openblas/bin" >> "$GITHUB_PATH"
          echo "C:/openblas/lib" >> "$GITHUB_PATH"

      - name: Install macOS dependencies
        if: runner.os == 'macOS' && steps.settings.outputs.profile == 'full'
        shell: bash
        run: |
          brew update
          brew install \
            openblas \
            lapack \
            gmp \
            mpfr \
            metis \
            tbb \
            libomp

      - name: Configure SuiteSparse
        shell: bash
        run: |
          EXTRA_ARGS=()
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            export PATH="C:/openblas/bin:C:/openblas/lib:$PATH"
            EXTRA_ARGS+=(
              "-DBLA_VENDOR=OpenBLAS"
              "-DBLAS_LIBRARIES=C:/openblas/lib/libopenblas.lib"
              "-DLAPACK_LIBRARIES=C:/openblas/lib/libopenblas.lib"
              "-DCMAKE_PREFIX_PATH=C:/openblas"
              "-DCMAKE_INCLUDE_PATH=C:/openblas/include"
              "-DCMAKE_LIBRARY_PATH=C:/openblas/lib"
            )
          fi

          cmake \
            -S _deps/SuiteSparse \
            -B _build/SuiteSparse \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/_install/suitesparse" \
            -DSUITESPARSE_ENABLE_PROJECTS="${{ steps.settings.outputs.projects }}" \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_STATIC_LIBS=ON \
            -DSUITESPARSE_USE_CUDA=OFF \
            "${EXTRA_ARGS[@]}"

      - name: Build SuiteSparse
        shell: bash
        run: |
          PARALLEL_FLAG="--parallel"
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            PARALLEL_FLAG="--parallel 3"
          fi
          cmake --build _build/SuiteSparse --config Release $PARALLEL_FLAG

      - name: Install SuiteSparse
        shell: bash
        run: |
          cmake --install _build/SuiteSparse --config Release

      - name: Run KLU smoke test
        shell: bash
        run: |
          python ci/smoke_test/run_smoke_test.py --install-dir _install/suitesparse --profile "${{ steps.settings.outputs.profile }}"

      - name: Collect license and metadata
        shell: bash
        run: |
          mkdir -p _install/suitesparse/licenses
          cp _deps/SuiteSparse/LICENSE.txt _install/suitesparse/licenses/ || true
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("_install/suitesparse")
          metadata = {
              "suitesparse_version": "${{ steps.settings.outputs.suitesparse_ref }}",
              "platform": "${{ matrix.platform }}",
              "arch": "${{ matrix.arch }}",
              "profile": "${{ steps.settings.outputs.profile }}",
              "projects": "${{ steps.settings.outputs.projects }}",
              "build_type": "Release",
              "static": True,
              "shared": True,
              "cuda": False
          }
          (root / "metadata.json").write_text(json.dumps(metadata, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload SuiteSparse artifact
        uses: actions/upload-artifact@v4
        with:
          name: suitesparse-${{ steps.settings.outputs.suitesparse_ref }}-${{ matrix.name }}-${{ steps.settings.outputs.profile }}
          path: _install/suitesparse
          if-no-files-found: error
          retention-days: 14
